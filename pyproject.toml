[project]
name = "agmod"
version = "0.2.0"
description = "Local LLM block manager"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=0.61",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
agmod = "agmod.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py313"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.2",
]
build = [
    "pyinstaller>=6.6",
]
